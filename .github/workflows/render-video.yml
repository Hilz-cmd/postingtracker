name: Render video

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  render:
    name: Render video
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx remotion render StatesVideo out/us-states.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: us-states-video
          path: out/us-states.mp4
