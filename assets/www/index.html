<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Content Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--bg:#0a0e17;--card:#111827;--line:#1f2a3d;--text:#e6ecf5;--mute:#7b8aa3;--accent:#3b82f6;--accent2:#60a5fa;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:radial-gradient(900px 500px at 15% -10%,#0f1d3a 0%,transparent 60%),var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif}
main{max-width:1200px;margin:0 auto;padding:40px 24px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:48px;animation:rise .7s ease both}
.clock{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:clamp(40px,7vw,76px);font-weight:500;letter-spacing:-.02em;line-height:1;color:var(--text)}
.clock .c{color:var(--accent);animation:blink 1s steps(2,jump-none) infinite}
.clock .ap{font-size:.28em;color:var(--accent2);margin-left:.5em;letter-spacing:.08em}
.hello{text-align:right}
.hello h1{margin:0;font-size:clamp(22px,3.4vw,38px);font-weight:500;letter-spacing:-.01em}
.hello h1 span{color:var(--accent2)}
.hello p{margin:8px 0 0;color:var(--mute);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{--a:var(--accent);--a2:var(--accent2);--g:rgba(59,130,246,.55);background:linear-gradient(180deg,var(--card),#0e1522);border:1px solid var(--line);border-radius:14px;padding:22px 20px 20px;position:relative;overflow:hidden;animation:rise .7s ease both;transition:border-color .4s,box-shadow .4s,translate .35s ease}
.card::after{content:"";position:absolute;inset:0;background:radial-gradient(260px 160px at 50% -20%,var(--g),transparent 70%);opacity:0;transition:opacity .4s;pointer-events:none}
.card:hover{translate:0 -4px;border-color:var(--a)}
.card:hover::after{opacity:.55}
#c-dani{--a:#f97316;--a2:#fb923c;--g:rgba(249,115,22,.5)}
#c-camilla{--a:#f4a6c6;--a2:#f9c9de;--g:rgba(244,166,198,.45)}
#c-camilla .box svg{stroke:#3a1f2d}
#c-sepia{--a:#a67c52;--a2:#d4a574;--g:rgba(166,124,82,.5)}
.card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.16s}.card:nth-child(4){animation-delay:.24s}
.card.done{border-color:var(--a);box-shadow:0 0 0 1px var(--a) inset,0 8px 40px -12px var(--g)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:20px}
.top h2{margin:0;font-size:18px;font-weight:600;line-height:1.2}
.streak{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--a2);border:1px solid var(--line);border-radius:6px;padding:4px 8px;white-space:nowrap;transition:background .3s}
.streak.on{background:color-mix(in srgb,var(--a) 15%,transparent);border-color:var(--a)}
.step{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-top:1px solid var(--line);color:var(--text);font:inherit;font-size:16px;padding:14px 2px;cursor:pointer;text-align:left;transition:opacity .3s,color .3s}
.step:disabled{opacity:.35;cursor:not-allowed}
.step:not(:disabled):hover .box{border-color:var(--a2)}
.box{width:24px;height:24px;border-radius:6px;border:1.5px solid #34445f;display:grid;place-items:center;flex:none;transition:background .25s,border-color .25s}
.box svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .3s ease .05s}
.step.on .box{background:var(--a);border-color:var(--a);animation:pop .35s ease}
.step.on .box svg{stroke-dashoffset:0}
.step.on .lbl{color:var(--mute);text-decoration:line-through;text-decoration-color:rgba(123,138,163,.5)}
.bar{height:3px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--a2));transition:width .5s cubic-bezier(.3,.8,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:.25}}
@keyframes pop{50%{transform:scale(1.2)}}
@media(max-width:960px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){main{padding:28px 16px}header{flex-direction:column;align-items:flex-start}.hello{text-align:left}.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <div class="clock" id="clock" aria-label="Current time"></div>
    <div class="hello"><h1 id="greet"></h1><p id="sub"></p></div>
  </header>
  <section class="grid" id="grid"></section>
</main>
<script>
var PAGES=[{id:'fred',name:'Fred Business'},{id:'dani',name:'Dani Podcast'},{id:'camilla',name:'Nurse Camilla'},{id:'sepia',name:'Sepia Mindset'}];
var STEPS=['Created','Edited','Uploaded'];
var KEY='content-tracker-v1';
var state={};
try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){state={}}
function pad(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function entry(id){
  var e=state[id]||(state[id]={date:'',steps:[0,0,0],days:[]});
  var t=ymd(new Date());
  if(e.date!==t){e.date=t;e.steps=[0,0,0];}
  return e;
}
function streak(e){
  var set={};e.days.forEach(function(x){set[x]=1});
  var d=new Date(),n=0;
  if(!set[ymd(d)])d.setDate(d.getDate()-1);
  while(set[ymd(d)]){n++;d.setDate(d.getDate()-1);}
  return n;
}
function toggle(id,i){
  var e=entry(id);
  if(!e.steps[i]){if(i>0&&!e.steps[i-1])return;e.steps[i]=1;}
  else{for(var j=i;j<3;j++)e.steps[j]=0;}
  e.days=e.days.filter(function(x){return x!==e.date});
  if(e.steps.every(Boolean))e.days.push(e.date);
  e.days=e.days.slice(-400);
  save();update();
}
var grid=document.getElementById('grid');
PAGES.forEach(function(p){
  var c=document.createElement('article');c.className='card';c.id='c-'+p.id;
  var h='<div class="top"><h2>'+p.name+'</h2><span class="streak"></span></div>';
  STEPS.forEach(function(s,i){
    h+='<button class="step" data-i="'+i+'"><span class="box"><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3.2L13 5"/></svg></span><span class="lbl">'+s+'</span></button>';
  });
  h+='<div class="bar"><i></i></div>';
  c.innerHTML=h;
  c.querySelectorAll('.step').forEach(function(b){
    b.addEventListener('click',function(){toggle(p.id,+b.dataset.i)});
  });
  grid.appendChild(c);
});
function update(){
  var total=0;
  PAGES.forEach(function(p){
    var e=entry(p.id),c=document.getElementById('c-'+p.id);
    var n=e.steps.reduce(function(a,b){return a+b},0);total+=n;
    c.classList.toggle('done',n===3);
    c.querySelectorAll('.step').forEach(function(b,i){
      b.classList.toggle('on',!!e.steps[i]);
      b.disabled=i>0&&!e.steps[i-1];
    });
    c.querySelector('.bar i').style.width=(n/3*100)+'%';
    var s=streak(e),el=c.querySelector('.streak');
    el.textContent=s+(s===1?' day':' days');
    el.classList.toggle('on',s>0);
  });
  update.total=total;
  paintSub();
}
var DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function paintSub(){
  var d=new Date();
  document.getElementById('sub').textContent=DAYS[d.getDay()]+', '+d.getDate()+' '+MONTHS[d.getMonth()]+' · '+(update.total||0)+' of 12 steps done';
}
var lastDay=ymd(new Date());
function tick(){
  var d=new Date(),h=d.getHours();
  var hh=h%12||12;
  document.getElementById('clock').innerHTML=pad(hh)+'<span class="c">:</span>'+pad(d.getMinutes())+'<span class="c">:</span>'+pad(d.getSeconds())+'<span class="ap">'+(h<12?'AM':'PM')+'</span>';
  var g=h<5?'night':h<12?'morning':h<17?'afternoon':h<21?'evening':'night';
  var gEl=document.getElementById('greet'),txt='Good '+g+', ';
  if(gEl.dataset.g!==g){gEl.dataset.g=g;gEl.innerHTML=txt+'<span>Sir</span>';}
  var t=ymd(d);
  if(t!==lastDay){lastDay=t;update();}
}
update();tick();
setInterval(tick,1000);
document.addEventListener('visibilitychange',function(){if(!document.hidden){tick();update();}});
</script>
</body>
</html>
